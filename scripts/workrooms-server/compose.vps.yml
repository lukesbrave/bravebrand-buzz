# Public HTTPS for a community on a server its owner runs. Layered over
# ../local-community/compose.yml; setup.sh places both beside this Caddyfile.
services:
  gateway:
    environment:
      BUZZ_DOMAIN: ${BUZZ_DOMAIN:?set BUZZ_DOMAIN}
    ports:
      - "${WORKROOMS_HTTP_PORT:-80}:80"
      - "${WORKROOMS_HTTPS_PORT:-443}:443"
    volumes:
      - workrooms-caddy-data:/data
      - workrooms-caddy-config:/config

volumes:
  workrooms-caddy-data:
    labels:
      com.buzz.volume: caddy-data
  workrooms-caddy-config:
    labels:
      com.buzz.volume: caddy-config
