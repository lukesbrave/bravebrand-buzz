# Isolated adaptation of block/buzz deploy/compose (Apache-2.0).
# Changes: loopback-only access, resource caps, dedicated project/volumes, public HTTPS through Caddy.
name: workrooms
services:
  relay:
    image: ${BUZZ_IMAGE:?pin relay digest}
    env_file: [.env]
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:${POSTGRES_PASSWORD}@postgres:5432/buzz
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_GIT_REPO_PATH: /data/git
    ports: ["127.0.0.1:18447:3000"]
    volumes: [git-data:/data/git]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    mem_limit: 640m
    pids_limit: 256
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes: [redis-data:/data, "./redis.conf:/usr/local/etc/redis/redis.conf:ro"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -q NOAUTH"]
      interval: 5s
      retries: 12
    mem_limit: 96m
    restart: unless-stopped
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY}
    volumes: [media-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio: {condition: service_healthy}
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
    entrypoint:
      - /bin/sh
      - -euc
      - 'mc alias set local http://minio:9000 "$$BUZZ_S3_ACCESS_KEY" "$$BUZZ_S3_SECRET_KEY" >/dev/null; mc mb --ignore-existing local/buzz-media; mc anonymous set none local/buzz-media'
    mem_limit: 96m
    restart: "no"
  pairing:
    image: ${BUZZ_IMAGE:?pin relay digest}
    entrypoint: ["/usr/local/bin/buzz-pair-relay"]
    environment:
      BUZZ_PAIR_RELAY_BIND_ADDR: 0.0.0.0:5000
    ports: ["127.0.0.1:18448:5000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped
  community-https:
    image: caddy@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    network_mode: host
    environment:
      COMMUNITY_HOST: ${COMMUNITY_HOST:?set the public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mobile-caddy-data:/data
      - mobile-caddy-config:/config
    mem_limit: 96m
    pids_limit: 64
    restart: unless-stopped
volumes:
  mobile-caddy-data: {}
  mobile-caddy-config: {}
  postgres-data: {}
  redis-data: {}
  media-data: {}
  git-data: {}
